<mat-form-field appearance="outline" class="w-full">
  <mat-label>{{ field().label }}</mat-label>
  <mat-select [required]="field().required">
    @if(field().options) { @for (option of field().options; track option.value)
    {
    <mat-option [value]="option.value">{{ option.label }}</mat-option>
    } } @else {
    <mat-option value="value1">Option 1</mat-option>
    <mat-option value="value2">Option 2</mat-option>
    <mat-option value="value3">Option 3</mat-option>
    }
  </mat-select>
</mat-form-field>
