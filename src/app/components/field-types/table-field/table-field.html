<div [formGroup]="tableForm">
  <button
    *ngIf="!isEditorMode"
    mat-raised-button
    color="primary"
    (click)="addRow()"
  >
    Add Row
  </button>
  <table mat-table [dataSource]="rows.controls" class="mat-elevation-z8">
    <!-- Dynamic Column -->

    <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
      <th mat-header-cell *matHeaderCellDef>
        <div *ngIf="!col.isEditing" (dblclick)="editColumn(col)">
          {{ col.label }}
          <button mat-icon-button color="primary" (click)="editColumn(col)">
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            (click)="removeColumn(columns.indexOf(col))"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <div *ngIf="col.isEditing">
          <mat-form-field appearance="outline" class="w-full mb-2">
            <mat-label>Column Name</mat-label>
            <input
              matInput
              [value]="col.label"
              #nameInput
              (blur)="updateColumnKeyAndLabel(col, nameInput.value)"
              (keydown.enter)="updateColumnKeyAndLabel(col, nameInput.value)"
              autofocus
            />
          </mat-form-field>
        </div>
      </th>
      <td mat-cell *matCellDef="let row" [formGroup]="row">
        <div *ngIf="!field().required">
          <mat-form-field appearance="outline" class="w-full">
            <!-- <mat-label>{{ setting.label }}</mat-label> -->
            <input matInput [formControlName]="col.key" />
          </mat-form-field>
        </div>

        <div *ngIf="field().required"></div>
        <!--  -->
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumnKeys()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumnKeys()"></tr>
  </table>

  <div class="mt-3 d-flex gap-2" *ngIf="isEditorMode">
    <!-- <button mat-raised-button color="primary" (click)="addRow()">
      Add Row
    </button> -->
    <button mat-raised-button color="accent" (click)="addColumn(field().id)">
      Add Column
    </button>
    <button mat-raised-button color="warn" (click)="submit()">Submit</button>
  </div>
</div>
