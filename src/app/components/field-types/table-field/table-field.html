  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource">
      <ng-container *ngFor="let col of displayedColumns" [matColumnDef]="col">
        <th mat-header-cell *matHeaderCellDef>{{ col }}</th>
        <td mat-cell *matCellDef="let element">
          <input
            matInput
            [(ngModel)]="element[col]"
            [ngModelOptions]="{ standalone: true }"
          />
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <div class="mt-3 d-flex gap-2" *ngIf="isEditorMode">
    <!-- <button mat-raised-button color="primary" (click)="addRow()">
      Add Row
    </button> -->
    <button mat-raised-button color="accent" (click)="addColumn()">
      Add Column
    </button>
    <button mat-raised-button color="warn" (click)="submit()">Submit</button>
  </div>
</div>
